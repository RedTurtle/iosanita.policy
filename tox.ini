[tox]
envlist =
    lint,
    black-check,
    py{311,312}-Plone{60},
#    docs,
#    coverage-report,

skip_missing_interpreters = True


[gh-actions]
python =
    3.11: py311
    3.12: py312


[gh-actions:env]
PLONE-VERSION =
    Plone60: Plone60


[testenv]
skip_install = true

extras =
    develop
    test

commands =
    {envbindir}/buildout -q -c {toxinidir}/{env:version_file} buildout:directory={envdir} buildout:develop={toxinidir} bootstrap
#    {envbindir}/buildout -c {toxinidir}/{env:version_file} buildout:directory={envdir} buildout:develop={toxinidir} annotate
    {envbindir}/buildout -n -qq -c {toxinidir}/{env:version_file} buildout:directory={envdir} buildout:develop={toxinidir} install test robot
    coverage run {envbindir}/test -v1 --auto-color {posargs}
    # coverage run {envbindir}/test -v --all -t robot {posargs}

setenv =
    COVERAGE_FILE=.coverage.{envname}
    Plone60: version_file=test_plone60.cfg

deps =
    Plone60: -rrequirements_plone60.txt
#    Plone60: -cconstraints_plone60.txt
    coverage


[testenv:coverage-report]
skip_install = true
usedevelop = True
basepython = python3.11

deps =
    coverage
    -cconstraints_plone60.txt

setenv =
    COVERAGE_FILE=.coverage

commands =
    coverage erase
    coverage combine
    coverage html
    coverage xml
    coverage report


[lint]
skip_install = true

deps =
    -cconstraints.txt
    isort
    flake8
    # helper to generate HTML reports:
    # flake8-html>=0.4.3
    # Useful flake8 plugins that are Python and Plone specific:
    ; flake8-coding
    flake8-debugger
    flake8-deprecated
    flake8-print
    #flake8-pytest
    flake8-todo
    mccabe
    # Potential flake8 plugins that should be used:  # TBD
    #flake8-blind-except
    #flake8-commas
    #flake8-docstrings
    #flake8-mypy
    #flake8-pep3101
    #flake8-plone-hasattr
    #flake8-string-format
    #flake8_strict
    #flake8-quotes
    #flake8-polyfill

commands =
    mkdir -p {toxinidir}/reports/flake8
    flake8 --doctests {toxinidir}/src {toxinidir}/setup.py
    isort --check-only {toxinidir}/src {toxinidir}/setup.py
    # black --check --diff -v {toxinidir}/src {toxinidir}/setup.py

allowlist_externals =
    mkdir


[testenv:isort-apply]
skip_install = true

deps =
    -cconstraints.txt
    isort

commands =
    isort {toxinidir}/src {toxinidir}/setup.py


[testenv:black-check]
basepython = python3.11
skip_install = True
deps =
    -cconstraints.txt
    black==25.12.0

commands =
    black --check --diff -v src setup.py


[testenv:black-enforce]
basepython = python3.11
skip_install = True
deps =
    -cconstraints.txt
    black==25.12.0

commands =
    black -v src setup.py


[testenv:lint]
skip_install = true
deps =
    -cconstraints.txt
    black==25.12.0
    isort
    flake8
    flake8-debugger
    flake8-deprecated
    flake8-print
    flake8-todo
    mccabe
    bandit
    pyroma==4.2
    zpretty

commands =
    black --check --diff src setup.py
    isort --check-only src setup.py
    flake8 src setup.py
    bandit -r src
    pyroma -n 10 -d .
    find {toxinidir}/src -name "*.zcml" -exec zpretty --check {} +

allowlist_externals =
    find


[testenv:docs]
skip_install = true

deps =
    Sphinx

commands =
    sphinx-build -b html -d _build/docs/doctrees docs _build/docs/html
