name: Security check - Bandit

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Bandit
      run: pip install bandit
    - name: Run Security check - Bandit
      run: |
        mkdir -p output
        bandit -r src -f txt -o output/security_report.txt
